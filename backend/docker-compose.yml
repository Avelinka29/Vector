services:
  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      VECTOR_DATABASE_URL: postgresql+asyncpg://vector:vector@postgres:5432/vector
      VECTOR_JWT_SECRET: development-only-change-this-secret
      VECTOR_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ../institutions.seed.json:/data/institutions.seed.json:ro
      - ../specialties.seed.json:/data/specialties.seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
    ports:
      - "5432:5432"
    volumes:
      - vector_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vector_postgres_data:

name: vector-backend

services:
  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      VECTOR_DATABASE_URL: postgresql+asyncpg://vector:vector@postgres:5432/vector
      VECTOR_JWT_SECRET: development-only-change-this-secret
      VECTOR_ALLOWED_ORIGINS: http://localhost:3000
      VECTOR_WEB_APP_URL: ${VECTOR_WEB_APP_URL:-http://localhost:4173}
      VECTOR_SMTP_HOST: ${VECTOR_SMTP_HOST:-}
      VECTOR_SMTP_PORT: ${VECTOR_SMTP_PORT:-587}
      VECTOR_SMTP_USERNAME: ${VECTOR_SMTP_USERNAME:-}
      VECTOR_SMTP_PASSWORD: ${VECTOR_SMTP_PASSWORD:-}
      VECTOR_SMTP_FROM_EMAIL: ${VECTOR_SMTP_FROM_EMAIL:-support@vector.by}
      VECTOR_SMTP_USE_TLS: ${VECTOR_SMTP_USE_TLS:-true}
    ports:
      - "8002:8000"
    volumes:
      - ../institutions.seed.json:/data/institutions.seed.json:ro
      - ../specialties.seed.json:/data/specialties.seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
    ports:
      - "5434:5432"
    volumes:
      - vector_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vector_postgres_data:
    name: backend_vector_postgres_data
    external: true
